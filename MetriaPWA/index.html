<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Metria</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LIVE USAGE</p>
        <h1>Metria</h1>
      </div>
      <span id="connectionStatus" class="status status-idle">Not connected</span>
    </header>

    <section id="setup" class="panel setup-panel">
      <p class="section-label">Connect your topic</p>
      <p class="muted">Use the same ntfy topic configured in the Mac app.</p>
      <form id="topicForm" class="topic-form">
        <label>
          <span>ntfy server</span>
          <input id="serverInput" type="url" value="https://ntfy.sh" inputmode="url" required>
        </label>
        <label>
          <span>Topic</span>
          <input id="topicInput" type="text" placeholder="your-private-topic" autocomplete="off" required>
        </label>
        <button type="submit">Connect</button>
      </form>
    </section>

    <section id="dashboard" class="dashboard" hidden>
      <div class="dashboard-heading">
        <div>
          <p class="section-label">Current snapshot</p>
          <p id="lastUpdated" class="muted">Waiting for the Mac app</p>
        </div>
        <button id="changeTopic" class="text-button" type="button">Change topic</button>
      </div>
      <div id="providerGrid" class="provider-grid"></div>
      <div id="emptyState" class="panel empty-state" hidden>
        <strong>No snapshot received yet</strong>
        <span>Leave Metria running on your Mac to publish usage updates.</span>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
