<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://opencode.ai;"><title>Metria Desktop</title><link rel="stylesheet" href="./styles.css"></head>
  <body><main><header><div><p class="eyebrow">Live usage</p><h1><img class="brand" src="./metria-logo.png" alt="Metria">Metria <span>Desktop</span></h1></div><button id="refresh" type="button">Refresh</button></header><p id="status" role="status">Loading provider usage…</p><section id="providers" aria-live="polite"></section><section class="about"><h2>Display</h2><label class="toggle"><input id="notch-mode" type="checkbox"><span>Show side notch on this display</span></label></section><section class="about"><h2>iPhone pairing</h2><p>Phone sync is disabled by default. Enabling it allows Metria to send encrypted usage snapshots to ntfy.sh; no usage leaves this device while it stays off.</p><label class="toggle"><input id="phone-sync" type="checkbox"><span>Enable encrypted phone sync</span></label><p id="pairing-status" class="hint" role="status"></p><img id="pairing-qr" alt="Metria iPhone pairing QR code" hidden><p id="pairing-link" hidden></p><button id="regenerate" type="button" hidden>Regenerate pairing</button></section></main><script src="./index.js"></script></body>
</html>
