appId: com.metria.electron
productName: Metria Electron
icon: ../Assets/metria-mascot.png
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
extraResources:
  - from: ../Assets
    to: MetriaPWA
  # The PWA the local pairing server hands to a phone, alongside the shared logos.
  - from: ../pwa/public
    to: MetriaPWA
win:
  target:
    - nsis
  artifactName: Metria-Electron-Setup-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Utility
  syncDesktopName: true
  artifactName: Metria-Electron-${version}-${arch}.${ext}
publish:
  provider: generic
  url: https://github.com/yurirxmos/metria/releases/download/electron-latest/
