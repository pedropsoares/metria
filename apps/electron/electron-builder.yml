appId: com.metria.electron
productName: Metria Desktop
icon: resources/icon.png
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
mac:
  category: public.app-category.productivity
  target:
    - dmg
  artifactName: Metria-Desktop-${version}-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: Metria-Desktop-Setup-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Utility
  syncDesktopName: true
  artifactName: Metria-Desktop-${version}-${arch}.${ext}
publish:
  provider: github
  owner: yurirxmos
  repo: metria
