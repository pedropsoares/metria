name: MetriaMobile
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.metria.ios
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settingGroups:
  shared:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MetriaCore:
    type: framework
    platform: iOS
    sources:
      - path: ../macos-native/Sources/MetriaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metria.ios.core
        MACH_O_TYPE: staticlib
      groups: [shared]

  MetriaMobileKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/MetriaMobileKit
    dependencies:
      - target: MetriaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metria.ios.mobilekit
        MACH_O_TYPE: staticlib
      groups: [shared]

  MetriaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/MetriaWidgets
      - path: ../../Assets/claude-logo.png
        buildPhase: resources
      - path: ../../Assets/codex-logo.png
        buildPhase: resources
      - path: ../../Assets/cursor-logo.png
        buildPhase: resources
      - path: ../../Assets/opencode-logo.png
        buildPhase: resources
    dependencies:
      - target: MetriaCore
      - target: MetriaMobileKit
    entitlements:
      path: Entitlements/MetriaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.metria.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.metria.shared
    info:
      path: Generated/MetriaWidgets-Info.plist
      properties:
        CFBundleDisplayName: Metria Usage
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: Metria reads your AI provider usage from your Mac on the same Wi-Fi network.
        NSBonjourServices:
          - _metria._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metria.ios.app.widgets
        PRODUCT_NAME: MetriaWidgets
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: Metria Usage
      groups: [shared]

  MetriaMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/MetriaMobile
      - path: Resources
      - path: ../../Assets/claude-logo.png
        buildPhase: resources
      - path: ../../Assets/codex-logo.png
        buildPhase: resources
      - path: ../../Assets/cursor-logo.png
        buildPhase: resources
      - path: ../../Assets/opencode-logo.png
        buildPhase: resources
      - path: ../../Assets/metria-logo.png
        buildPhase: resources
      - path: ../../Assets/metria-mascot.png
        buildPhase: resources
    dependencies:
      - target: MetriaCore
      - target: MetriaMobileKit
      - target: MetriaWidgets
        embed: true
    entitlements:
      path: Entitlements/MetriaMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.metria.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.metria.shared
    info:
      path: Generated/MetriaMobile-Info.plist
      properties:
        CFBundleDisplayName: Metria
        UILaunchScreen: {}
        NSCameraUsageDescription: Metria scans the QR code shown on your Mac to pair.
        NSLocalNetworkUsageDescription: Metria reads your AI provider usage from your Mac on the same Wi-Fi network.
        NSBonjourServices:
          - _metria._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.metria.ios.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metria.ios.app
        PRODUCT_NAME: Metria
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: Metria
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      groups: [shared]

schemes:
  MetriaMobile:
    build:
      targets:
        MetriaMobile: all
        MetriaWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
