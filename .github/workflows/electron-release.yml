name: win & linux app deploy

on:
  push:
    tags:
      - "electron-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example electron-v0.1.5"
        required: true
        default: "electron-v0.1.5"

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
          - runner: windows-latest
            target: win
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/electron

      - name: Set package version
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" == electron-v* ]]
          npm version "${RELEASE_TAG#electron-v}" --no-git-tag-version --allow-same-version
        working-directory: apps/electron

      # The Electron artifacts are unsigned (no certificate secrets for this app):
      # Windows SmartScreen may warn when installing them.
      - name: Package
        run: npm run package
        working-directory: apps/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: metria-electron-${{ matrix.target }}
          path: apps/electron/release/**

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: metria-electron-*
          merge-multiple: true
          path: release

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.version || github.ref_name }}"
          [[ "$tag" == electron-v* ]]
          artifacts="$(find release -maxdepth 1 -type f \( -name 'Metria-Electron-Setup-*.exe' -o -name 'Metria-Electron-*.AppImage' -o -name 'latest.yml' -o -name 'latest-linux.yml' \))"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $artifacts --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" $artifacts --title "$tag" --generate-notes --repo "${{ github.repository }}"
          fi

          if gh release view electron-latest >/dev/null 2>&1; then
            gh release upload electron-latest $artifacts --clobber --repo "${{ github.repository }}"
          else
            gh release create electron-latest $artifacts --title "Electron latest" --notes "Electron update channel." --repo "${{ github.repository }}"
          fi
