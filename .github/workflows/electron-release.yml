name: win & linux app deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.5"
        required: true
        default: "v0.1.5"

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
          - runner: windows-latest
            target: win
          - runner: macos-latest
            target: mac
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/electron

      # The Electron artifacts are unsigned (no certificate secrets for this app):
      # Windows SmartScreen or macOS Gatekeeper may warn when installing them.
      - name: Package
        run: npm run package
        working-directory: apps/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: metria-electron-${{ matrix.target }}
          path: apps/electron/release/**

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: metria-electron-*
          merge-multiple: true
          path: release

      # Keep exactly one installer per platform (plus the mandatory update
      # channel files), so the release reads Metria-Windows/Linux/macOS.
      # Native macOS artifacts (Metria-v*) and appcast.xml belong to the native
      # Sparkle update flow and are preserved.
      - name: Clean stale Electron assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.version || github.ref_name }}"
          assets="$(gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null || true)"
          for asset in $assets; do
            case "$asset" in
              Metria-Desktop-*.deb|Metria-Desktop-*.blockmap|Metria-Desktop-*.zip|builder-debug.yml|latest-mac.yml)
                gh release delete-asset "$tag" "$asset" --repo "${{ github.repository }}" -y || true;;
            esac
          done

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.version || github.ref_name }}"
          artifacts="$(find release -maxdepth 1 -type f \( -name 'Metria-Desktop-Setup-*.exe' -o -name 'Metria-Desktop-*.AppImage' -o -name 'Metria-Desktop-*.dmg' -o -name 'latest.yml' -o -name 'latest-linux.yml' \))"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $artifacts --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" $artifacts --title "$tag" --generate-notes --repo "${{ github.repository }}"
          fi
