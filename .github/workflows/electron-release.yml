name: win & linux app deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.5"
        required: true
        default: "v0.1.5"

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
          - runner: windows-latest
            target: win
          - runner: macos-latest
            target: mac
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/electron

      # The Electron artifacts are unsigned (no certificate secrets for this app):
      # Windows SmartScreen or macOS Gatekeeper may warn when installing them.
      - name: Package
        run: npm run package
        working-directory: apps/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload package artifact
        uses: actions/upload-artifact@v5
        with:
          name: metria-electron-${{ matrix.target }}
          path: apps/electron/release/**

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: metria-electron-*
          merge-multiple: true
          path: release

      # Same tag as the native macOS release workflow: upload alongside if the
      # release already exists, otherwise create it with all artifacts.
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.version || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --repo "${{ github.repository }}"
          else
            gh release create "$tag" release/* --title "$tag" --generate-notes --repo "${{ github.repository }}"
          fi
