name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: intel
          - runner: macos-14
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Apple signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" ]]; then
            exit 0
          fi

          keychain_path="$RUNNER_TEMP/metria-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/notary-key.p8"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -s "$keychain_path"

          printf 'CODESIGN_IDENTITY=%s\n' "$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          if [[ -n "$APPLE_NOTARY_KEY_BASE64" ]]; then
            printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$notary_key_path"
            xcrun notarytool store-credentials metria-notary \
              --key "$notary_key_path" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER"
            printf 'NOTARY_PROFILE=metria-notary\n' >> "$GITHUB_ENV"
          fi

      - name: Package app
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          SPARKLE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$SPARKLE_PUBLIC_ED_KEY"
          bash scripts/package-macos.sh

      - name: Rename archive
        run: mv "dist/Metria-${{ inputs.version || github.ref_name }}-$(uname -m).zip" "dist/Metria-${{ inputs.version || github.ref_name }}-${{ matrix.arch }}.zip"
      - name: Rename disk image
        run: mv "dist/Metria-${{ inputs.version || github.ref_name }}-$(uname -m).dmg" "dist/Metria-${{ inputs.version || github.ref_name }}-${{ matrix.arch }}.dmg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metria-${{ matrix.arch }}
          path: |
            dist/Metria-${{ inputs.version || github.ref_name }}-${{ matrix.arch }}.zip
            dist/Metria-${{ inputs.version || github.ref_name }}-${{ matrix.arch }}.dmg

  publish:
    needs: package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Metria-*
          merge-multiple: true

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_ED_KEY"
          swift build
          sparkle_bin=".build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$sparkle_bin" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ inputs.version || github.ref_name }}/" \
            --link "https://github.com/${{ github.repository }}" \
            dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.version || github.ref_name }}" dist/* --generate-notes --repo "${{ github.repository }}"
