name: Auto-tag release

on:
  push:
    branches:
      - main
    paths:
      - "Assets/**"
      - "Package.swift"
      - "Package.resolved"
      - "apps/macos-native/**"

permissions:
  contents: read
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          latest="$(git tag --list 'macos-v*' --sort=-v:refname | head -1)"
          if [[ -z "$latest" ]]; then
            next="macos-v0.1.0"
          else
            version="${latest#macos-v}"
            IFS='.' read -r major minor patch <<< "$version"
            next="macos-v${major}.${minor}.$((patch + 1))"
          fi
          echo "Next release: $next (previous: ${latest:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      # Dispatches release.yml's workflow_dispatch trigger instead of pushing a git tag
      # directly: a tag pushed with the default GITHUB_TOKEN does not fire other
      # workflows' `on: push: tags` triggers (GitHub suppresses that to prevent
      # infinite loops), so release.yml would silently never run. `gh release create`
      # inside release.yml creates the tag itself once the build succeeds.
      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" -f version="${{ steps.version.outputs.tag }}"
